<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muaraversa Admin Login</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<main class="container">
<section class="admin-card" aria-labelledby="login-title">
<h1 id="login-title">Login Admin Muaraversa</h1>
<form id="loginForm" autocomplete="off">
<label for="username">Username</label>
<input id="username" name="username" type="text" placeholder="Username" required autocomplete="username">

<label for="password">Password</label>
<input id="password" name="password" type="password" placeholder="Password" required autocomplete="current-password">

<button type="submit">Masuk</button>
</form>
</section>
</main>
<script src="assets/js/auth.js"></script>
</body>
</html>
