<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Siswa - Muaraversa Admin</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="container">
<h1>Data Siswa</h1>

<section class="student-form">
<input id="name" type="text" placeholder="Nama siswa" autocomplete="off">
<input id="nis" type="text" placeholder="NIS" autocomplete="off">
<input id="class_id" type="text" placeholder="ID Kelas" autocomplete="off">
<button type="button" onclick="addStudent()">Tambah Siswa</button>
</section>

<div class="actions">
<button type="button" onclick="loadStudents()">Refresh Data</button>
</div>

<table>
<thead>
<tr>
<th>Nama</th>
<th>NIS</th>
<th>Kelas ID</th>
<th>Aksi</th>
</tr>
</thead>
<tbody id="studentList">
<tr>
<td colspan="4">Memuat data siswa...</td>
</tr>
</tbody>
</table>
</div>

<script src="assets/js/students.js"></script>
</body>
</html>
